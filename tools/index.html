<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f1a'/%3E%3Crect x='9' y='5' width='14' height='22' fill='none' stroke='%23f4efe6' stroke-width='2.2'/%3E%3Cpath d='M9 12h14M9 17h14M9 22h14' stroke='%23ffb454' stroke-width='2'/%3E%3C/svg%3E">
<title>Flatpack — authoring tool</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a22; --panel2:#1b222c; --line:#2a3340;
    --ink:#e7edf5; --dim:#8b98a8; --accent:#ffb454; --cyan:#7fe3ff;
    --ok:#7d8f74; --bad:#c9564a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
    overflow:hidden;
  }
  header{
    height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--line);
  }
  header h1{font-size:13px;font-weight:600;margin:0 6px 0 0;letter-spacing:.02em}
  header h1 span{color:var(--accent)}
  select,input,textarea,button{
    font:inherit;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;padding:5px 8px;
  }
  button{cursor:pointer}
  button:hover{background:#243040}
  button.primary{background:#2b4a63;border-color:#3d6d92}
  button.primary:hover{background:#356}
  button.warn:hover{background:#4a2b2b;border-color:#7a3d3d}
  textarea{width:100%;resize:vertical;min-height:56px;font-size:12px}
  .spacer{flex:1}
  .pill{font:500 11px ui-monospace,monospace;padding:3px 8px;border-radius:99px;
    background:#1f2733;color:var(--dim);border:1px solid var(--line)}

  main{display:grid;grid-template-columns:132px 1fr 340px;height:calc(100% - 48px)}

  /* ---- page strip -------------------------------------------------- */
  #strip{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:8px}
  .thumb{position:relative;margin-bottom:8px;cursor:pointer;border:2px solid transparent;border-radius:4px;overflow:hidden;background:#000}
  .thumb img{display:block;width:100%}
  .thumb.on{border-color:var(--accent)}
  .thumb.cur{outline:2px solid var(--cyan);outline-offset:-2px}
  .thumb .n{position:absolute;top:2px;left:2px;background:#000a;color:#fff;
    font:600 10px ui-monospace,monospace;padding:1px 4px;border-radius:3px}
  .thumb .tog{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:3px;
    background:#000a;color:#fff;font:600 11px/16px ui-monospace,monospace;text-align:center}
  .thumb.on .tog{background:var(--accent);color:#201400}

  /* ---- page viewer ------------------------------------------------- */
  #stage{position:relative;overflow:auto;background:#0a0d12;display:flex;
    align-items:flex-start;justify-content:center;padding:16px}
  #pagewrap{position:relative;flex:none;box-shadow:0 8px 40px #0009;background:#fff}
  #pagewrap img{display:block;width:100%}
  #overlay{position:absolute;inset:0;cursor:crosshair}
  .hot{position:absolute;border:1.5px solid var(--cyan);background:#7fe3ff1f}
  .hot.sel{border-color:var(--accent);background:#ffb4542e;border-width:2px}
  .hot .lbl{position:absolute;top:-1px;left:-1px;background:var(--cyan);color:#04202b;
    font:600 10px/1.3 ui-sans-serif;white-space:nowrap;padding:1px 5px;transform:translateY(-100%)}
  .hot.sel .lbl{background:var(--accent);color:#201400}
  #drawbox{position:absolute;border:1.5px dashed var(--accent);background:#ffb45422;display:none;pointer-events:none}
  #hint{position:absolute;left:12px;bottom:12px;background:#0b0e14dd;border:1px solid var(--line);
    padding:6px 10px;border-radius:6px;color:var(--dim);font-size:11.5px;pointer-events:none}

  /* ---- sidebar ----------------------------------------------------- */
  #side{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto}
  .sec{border-bottom:1px solid var(--line);padding:10px 12px}
  .sec h2{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
    display:flex;align-items:center;gap:6px}
  .sec h2 .spacer{flex:1}
  .row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .row label{flex:none;width:66px;color:var(--dim);font-size:11.5px}
  .row input,.row select,.row textarea{flex:1;min-width:0}

  .step{display:flex;gap:6px;align-items:center;padding:5px 6px;border-radius:5px;cursor:pointer}
  .step:hover{background:#1c2430}
  .step.sel{background:#23384a;outline:1px solid #3d6d92}
  .step .i{font:600 10px ui-monospace,monospace;color:var(--dim);width:20px;flex:none}
  .step .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .step .pg{font:500 10px ui-monospace,monospace;color:var(--dim)}
  .step .dot{width:6px;height:6px;border-radius:99px;flex:none}
  .empty{color:var(--dim);font-size:11.5px;font-style:italic;padding:4px 0}

  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:10.5px;
     text-transform:uppercase;letter-spacing:.06em;padding:2px 4px}
  td{padding:2px 4px;border-top:1px solid #202834}
  td input{width:100%;padding:3px 5px;font-size:11.5px}
  .x{cursor:pointer;color:var(--dim);font-weight:700}
  .x:hover{color:var(--bad)}

  /* ---- camera modal ------------------------------------------------ */
  #cam{position:fixed;inset:0;background:#06090ecc;display:none;z-index:50}
  #cam.on{display:block}
  #cam .inner{position:absolute;inset:5% 8%;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
  #cam header{height:40px;border-bottom:1px solid var(--line);background:var(--panel2)}
  #cvwrap{flex:1;position:relative;background:#0a0d12}
  #cv{display:block;width:100%;height:100%}
  #camhint{position:absolute;left:10px;bottom:10px;color:var(--dim);font-size:11.5px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#1b222c;border:1px solid var(--line);padding:8px 16px;border-radius:8px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
  #toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <h1>flatpack <span>/</span> author</h1>
  <select id="pick" style="min-width:280px"></select>
  <span class="pill" id="stat">—</span>
  <div class="spacer"></div>
  <select id="gran" title="hotspot granularity" style="padding:4px 6px">
    <option value="coarse">coarse</option><option value="fine">fine</option></select>
  <button id="autobox">Auto-assign boxes</button>
  <button id="sync">Sync steps to build pages</button>
  <button id="save" class="primary">Save</button>
  <a href="/viewer/" target="_blank"><button>Open viewer ↗</button></a>
</header>

<main>
  <div id="strip"></div>

  <div id="stage">
    <div id="pagewrap">
      <img id="pageimg" alt="">
      <div id="overlay"></div>
      <div id="drawbox"></div>
    </div>
    <div id="hint"></div>
  </div>

  <div id="side">
    <div class="sec">
      <h2>Steps <span class="spacer"></span>
        <button id="addstep" style="padding:2px 7px">+ add</button></h2>
      <div id="steps"></div>
    </div>

    <div class="sec" id="insp">
      <h2>Step</h2>
      <div id="inspbody"><div class="empty">No step selected</div></div>
    </div>

    <div class="sec">
      <h2>Parts <span class="spacer"></span>
        <button id="addpart" style="padding:2px 7px">+ add</button></h2>
      <div id="parts"></div>
    </div>

    <div class="sec">
      <h2>Hardware <span class="spacer"></span>
        <button id="addhw" style="padding:2px 7px">+ add</button></h2>
      <div id="hw"></div>
    </div>

    <div class="sec">
      <h2>Notes</h2>
      <textarea id="notes" placeholder="What is measured, what is read off the drawings, what is estimated."></textarea>
    </div>
  </div>
</main>

<!-- camera capture -->
<div id="cam">
  <div class="inner">
    <header>
      <h1 style="margin:0 0 0 12px">Camera for step <span id="camstep" style="color:var(--accent)">—</span></h1>
      <div class="spacer"></div>
      <button id="camuse" class="primary">Use this camera</button>
      <button id="camclose">Close</button>
    </header>
    <div id="cvwrap"><canvas id="cv"></canvas>
      <div id="camhint">drag to orbit · right-drag or shift-drag to pan · scroll to zoom</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="importmap">
{"imports":{"three":"/lib/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const S = 0.04;                       // cm -> world units
const $ = s => document.querySelector(s);
let doc=null, pid=null, curPage=1, sel=-1, dirty=false, sugg={}, gran='coarse';

/* ------------------------------------------------------------ helpers */
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = (p='p') => p+Math.random().toString(36).slice(2,7);
const clamp01 = v => Math.max(0,Math.min(1,v));

async function api(u,opt){ const r=await fetch(u,opt); return r.json(); }

/* ------------------------------------------------------------ load */
async function boot(){
  const cat = await api('/api/catalogue');
  $('#pick').innerHTML = cat.products.map(p =>
    `<option value="${p.id}">${esc(p.name)} — ${esc(p.typeName||'')} · ${p.steps} steps</option>`).join('');
  $('#pick').onchange = e => load(e.target.value);
  const keep = new URLSearchParams(location.search).get('id');
  await load(keep && cat.products.some(p=>p.id===keep) ? keep : cat.products[0]?.id);
}

async function load(id){
  if(!id) return;
  if(dirty && !confirm('Discard unsaved changes?')) return;
  pid=id; sel=-1;
  doc = await api(`/products/${id}/build.json`);
  // hotspot suggestions are optional; missing file is fine
  try { const r = await fetch(`/products/${id}/suggested_boxes.json`);
        sugg = r.ok ? ((await r.json()).pages||{}) : {}; }
  catch { sugg = {}; }
  const bp = doc.manual?.buildPages||[];
  curPage = bp[0] || doc.manual?.pages?.[0]?.page || 1;
  dirty=false;
  if(location.search!=='?id='+id) history.replaceState(null,'','?id='+id);
  $('#notes').value = doc.notes||'';
  renderAll();
}

/* ------------------------------------------------------------ strip */
function renderStrip(){
  const bp = new Set(doc.manual?.buildPages||[]);
  $('#strip').innerHTML = (doc.manual?.pages||[]).map(p=>`
    <div class="thumb ${bp.has(p.page)?'on':''} ${p.page===curPage?'cur':''}" data-pg="${p.page}">
      <img src="/products/${pid}/${doc.manual.dir||'manual'}/${p.file}" loading="lazy">
      <span class="n">${p.page}</span>
      <span class="tog" data-tog="${p.page}">${bp.has(p.page)?'✓':''}</span>
    </div>`).join('');
  $('#strip').querySelectorAll('.thumb').forEach(el=>{
    el.onclick = e=>{
      const pg=+el.dataset.pg;
      if(e.target.dataset.tog){ toggleBuildPage(+e.target.dataset.tog); return; }
      curPage=pg; renderAll();
    };
  });
}

function toggleBuildPage(pg){
  const bp=new Set(doc.manual.buildPages||[]);
  bp.has(pg) ? bp.delete(pg) : bp.add(pg);
  doc.manual.buildPages=[...bp].sort((a,b)=>a-b);
  dirty=true; renderAll();
}

/* ------------------------------------------------------------ page */
function pageFile(pg){
  const p=(doc.manual?.pages||[]).find(x=>x.page===pg);
  return p?`/products/${pid}/${doc.manual.dir||'manual'}/${p.file}`:null;
}
function renderPage(){
  const f=pageFile(curPage);
  $('#pageimg').src = f||'';
  const p=(doc.manual?.pages||[]).find(x=>x.page===curPage);
  $('#pagewrap').style.width = (p? Math.min(760, p.w/2):600)+'px';
  const ov=$('#overlay');
  ov.innerHTML=(doc.steps||[]).map((s,i)=>{
    if(s.page!==curPage || !s.box) return '';
    const [x0,y0,x1,y1]=s.box;
    return `<div class="hot ${i===sel?'sel':''}" data-i="${i}"
      style="left:${x0*100}%;top:${y0*100}%;width:${(x1-x0)*100}%;height:${(y1-y0)*100}%">
      <span class="lbl">${i+1}. ${esc(s.title||'')}</span></div>`;
  }).join('');
  ov.querySelectorAll('.hot').forEach(h=>h.onclick=e=>{
    e.stopPropagation(); select(+h.dataset.i);
  });
  $('#hint').textContent =
    `page ${curPage}${p?` · ${p.kind||''}`:''} — drag on the page to set the hotspot for step ${sel+1}`;
}

/* draw a hotspot */
(()=>{
  const ov=$('#overlay'), box=$('#drawbox');
  let st=null;
  ov.addEventListener('pointerdown',e=>{
    if(sel<0||!doc.steps[sel]) return;
    const r=ov.getBoundingClientRect();
    st={x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height, moved:false};
    ov.setPointerCapture(e.pointerId);
  });
  ov.addEventListener('pointermove',e=>{
    if(!st) return;
    const r=ov.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    if(Math.abs(x-st.x)>0.01||Math.abs(y-st.y)>0.01) st.moved=true;
    if(!st.moved){ box.style.display='none'; return; }
    box.style.display='block';
    box.style.left=Math.min(st.x,x)*100+'%'; box.style.top=Math.min(st.y,y)*100+'%';
    box.style.width=Math.abs(x-st.x)*100+'%'; box.style.height=Math.abs(y-st.y)*100+'%';
  });
  ov.addEventListener('pointerup',e=>{
    if(!st) return;
    const r=ov.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    if(st.moved){
      doc.steps[sel].box=[clamp01(Math.min(st.x,x)),clamp01(Math.min(st.y,y)),
                          clamp01(Math.max(st.x,x)),clamp01(Math.max(st.y,y))].map(v=>+v.toFixed(4));
      doc.steps[sel].page=curPage;
      doc.steps[sel].boxSource='human';
      markDirty();
      toast(`hotspot set on step ${sel+1}`);
    }
    st=null; box.style.display='none'; renderAll();
  });
})();

/* ------------------------------------------------------------ suggestions */
/* Auto-detected drawing panels for this step's page. Scored mean IoU 0.761
   against hand-placed boxes, right panel count on 7/8 benchmark pages - so
   these are confirm-or-nudge, not draw-from-scratch. */
function sugList(pg){ return ((sugg[pg]||{})[gran]) || []; }

function sugRow(s){
  const list=sugList(s.page);
  if(!list.length) return '<div class="row"><label>Suggested</label><span class="pill">none - run suggest_boxes.py</span></div>';
  const btns=list.map((b,i)=>
    `<button class="sugb" data-sug="${i}" style="padding:2px 7px" title="${b.box.join(', ')}">${i+1}</button>`).join(' ');
  return `<div class="row"><label>Suggested</label>${btns}
    <span class="pill">${gran} · ${list.length}</span></div>`;
}

/* Walk the steps in order, handing out the next unused panel on each page.
   Handles pages that carry more than one step. */
function autoAssign(){
  const cursor={}; let n=0;
  (doc.steps||[]).forEach(s=>{
    if(s.box) return;                       // never clobber authored work
    const list=sugList(s.page);
    const i=cursor[s.page]||0;
    if(i<list.length){ s.box=list[i].box.slice(); cursor[s.page]=i+1; n++; }
  });
  return n;
}

/* ------------------------------------------------------------ steps */
function select(i){ sel=i; const s=doc.steps[i]; if(s&&s.page) curPage=s.page; renderAll(); }

function renderSteps(){
  const el=$('#steps');
  if(!(doc.steps||[]).length){ el.innerHTML='<div class="empty">No steps yet — triage pages, then Sync.</div>'; return; }
  el.innerHTML=doc.steps.map((s,i)=>`
    <div class="step ${i===sel?'sel':''}" data-i="${i}">
      <span class="i">${i+1}</span>
      <span class="dot" style="background:${s.box?'var(--cyan)':'#3a4450'}"></span>
      <span class="t">${esc(s.title||'untitled')}</span>
      <span class="pg">p${s.page??'-'}</span>
      <span class="x" data-del="${i}">×</span>
    </div>`).join('');
  el.querySelectorAll('.step').forEach(d=>d.onclick=e=>{
    if(e.target.dataset.del!==undefined){ doc.steps.splice(+e.target.dataset.del,1); sel=Math.min(sel,doc.steps.length-1); dirty=true; renderAll(); return; }
    select(+d.dataset.i);
  });
}

function renderInsp(){
  const b=$('#inspbody'), s=doc.steps?.[sel];
  if(!s){ b.innerHTML='<div class="empty">No step selected</div>'; return; }
  const pgopts=(doc.manual?.pages||[]).map(p=>
    `<option value="${p.page}" ${p.page===s.page?'selected':''}>page ${p.page}${p.kind?' · '+p.kind:''}</option>`).join('');
  const hwopts=(doc.hardware||[]).map(h=>
    `<option value="${h.id}" ${h.id===s.kind?'selected':''}>${esc(h.label||h.id)}</option>`).join('');
  const partopts=(doc.parts||[]).map(p=>
    `<option value="${p.id}" ${(s.placeParts||[]).includes(p.id)?'selected':''}>${esc(p.label||p.id)}</option>`).join('');
  const hwCurCount = (s.placeHardware && s.kind) ? (s.placeHardware[s.kind] ?? '') : '';
  b.innerHTML=`
    <div class="row"><label>Title</label><input id="s_title" value="${esc(s.title||'')}"></div>
    <div class="row"><label>Page</label><select id="s_page">${pgopts}</select></div>
    <div class="row"><label>Hardware</label>
      <select id="s_kind"><option value="">—</option>${hwopts}</select>
      <input id="s_hwcount" type="number" min="0" value="${hwCurCount}" placeholder="qty" style="max-width:54px" title="Count placed on this step">
    </div>
    <div class="row"><label>Duration</label><input id="s_dur" type="number" step="0.5" min="0" value="${s.duration??4}" style="max-width:78px"></div>
    <div class="row"><label>Parts in</label><select id="s_parts" multiple size="3">${partopts}</select></div>
    <div class="row"><label>Hotspot</label>
      <span class="pill">${s.box?s.box.map(v=>v.toFixed(2)).join(', '):'not set'}</span>
      <button id="s_clear" class="warn" style="padding:2px 7px">clear</button></div>
    ${sugRow(s)}
    <div class="row"><label>Camera</label>
      <span class="pill">${s.cam?'set':'not set'}</span>
      <button id="s_cam" style="padding:2px 7px">frame it…</button></div>
    <div class="row" style="align-items:flex-start"><label>Prose</label>
      <textarea id="s_prose" placeholder="What the reader does, in one or two sentences.">${esc(s.prose||'')}</textarea></div>
    <div class="row" style="align-items:flex-start"><label>Warning</label>
      <input id="s_warn" value="${esc(s.warn||'')}" placeholder="e.g. two people, tip-over risk"></div>`;
  const bind=(id,fn,ev='input')=>{ const e=b.querySelector(id); if(e) e.addEventListener(ev,fn); };
  bind('#s_title',e=>{s.title=e.target.value;markDirty();renderSteps();});
  bind('#s_page',e=>{s.page=+e.target.value;curPage=s.page;markDirty();renderAll();},'change');
  bind('#s_kind',e=>{
    s.kind=e.target.value||null;
    if(!s.kind && s.placeHardware){ s.placeHardware={}; }
    markDirty();
    renderInsp();
  },'change');
  bind('#s_hwcount',e=>{
    const k=s.kind; if(!k) return;
    const n=+e.target.value;
    s.placeHardware=s.placeHardware||{};
    if(!n || n<=0) delete s.placeHardware[k];
    else s.placeHardware[k]=n;
    markDirty();
  });
  bind('#s_dur',e=>{s.duration=+e.target.value;markDirty();});
  bind('#s_parts',e=>{s.placeParts=[...e.target.selectedOptions].map(o=>o.value);markDirty();},'change');
  bind('#s_prose',e=>{s.prose=e.target.value;markDirty();});
  bind('#s_warn',e=>{s.warn=e.target.value;markDirty();});
  b.querySelectorAll('.sugb').forEach(x=>x.onclick=()=>{
    const box=sugList(s.page)[+x.dataset.sug];
    if(box){ s.box=box.box.slice(); s.boxSource='human'; markDirty(); renderAll(); toast('box applied'); }
  });
  b.querySelector('#s_clear').onclick=()=>{s.box=null;s.boxSource=null;markDirty();renderAll();};
  b.querySelector('#s_cam').onclick=openCam;
}

/* ------------------------------------------------------------ parts / hw */
function renderParts(){
  const el=$('#parts');
  if(!(doc.parts||[]).length){ el.innerHTML='<div class="empty">No parts yet</div>'; return; }
  el.innerHTML=`<table><tr><th>id</th><th>label</th><th>w</th><th>h</th><th>t</th><th>n</th><th></th></tr>`+
    doc.parts.map((p,i)=>`<tr>
      <td><input data-p="${i}" data-k="id" value="${esc(p.id)}" style="width:52px"></td>
      <td><input data-p="${i}" data-k="label" value="${esc(p.label||'')}"></td>
      <td><input data-p="${i}" data-k="w" type="number" value="${(p.size||[])[0]??''}" style="width:44px"></td>
      <td><input data-p="${i}" data-k="h" type="number" value="${(p.size||[])[1]??''}" style="width:44px"></td>
      <td><input data-p="${i}" data-k="t" type="number" step="0.1" value="${(p.size||[])[2]??''}" style="width:44px"></td>
      <td><input data-p="${i}" data-k="count" type="number" value="${p.count??1}" style="width:36px"></td>
      <td><span class="x" data-delp="${i}">×</span></td></tr>`).join('')+`</table>`;
  el.querySelectorAll('input').forEach(inp=>inp.oninput=e=>{
    const p=doc.parts[+e.target.dataset.p], k=e.target.dataset.k;
    if(k==='w'||k==='h'||k==='t'){ p.size=p.size||[0,0,0]; p.size[{w:0,h:1,t:2}[k]]=+e.target.value; }
    else if(k==='count') p.count=+e.target.value;
    else p[k]=e.target.value;
    markDirty();
  });
  el.querySelectorAll('[data-delp]').forEach(x=>x.onclick=()=>{
    doc.parts.splice(+x.dataset.delp,1); markDirty(); renderAll(); });
}

function renderHw(){
  const el=$('#hw');
  if(!(doc.hardware||[]).length){ el.innerHTML='<div class="empty">No hardware yet</div>'; return; }
  el.innerHTML=`<table><tr><th>id</th><th>label</th><th>part no</th><th>n</th><th></th></tr>`+
    doc.hardware.map((h,i)=>`<tr>
      <td><input data-h="${i}" data-k="id" value="${esc(h.id)}" style="width:58px"></td>
      <td><input data-h="${i}" data-k="label" value="${esc(h.label||'')}"></td>
      <td><input data-h="${i}" data-k="partNo" value="${esc(h.partNo||'')}" style="width:64px"></td>
      <td><input data-h="${i}" data-k="count" type="number" value="${h.count??0}" style="width:40px"></td>
      <td><span class="x" data-delh="${i}">×</span></td></tr>`).join('')+`</table>`;
  el.querySelectorAll('input').forEach(inp=>inp.oninput=e=>{
    const h=doc.hardware[+e.target.dataset.h], k=e.target.dataset.k;
    h[k] = k==='count' ? +e.target.value : e.target.value; markDirty();
  });
  el.querySelectorAll('[data-delh]').forEach(x=>x.onclick=()=>{
    doc.hardware.splice(+x.dataset.delh,1); markDirty(); renderAll(); });
}

/* ------------------------------------------------------------ render */
function updateStat(){
  const bp=(doc.manual?.buildPages||[]).length, st=(doc.steps||[]).length;
  const done=(doc.steps||[]).filter(s=>s.box&&s.cam).length;
  $('#stat').textContent = `${bp} pages · ${st} steps · ${done} complete${dirty?' · unsaved':''}`;
}
function markDirty(){ dirty=true; updateStat(); }

function renderAll(){
  renderStrip(); renderPage(); renderSteps(); renderInsp(); renderParts(); renderHw();
  updateStat();
}

/* buttons */
$('#addstep').onclick=()=>{
  doc.steps=doc.steps||[];
  doc.steps.push({title:`Step ${doc.steps.length+1}`,page:curPage,box:null,duration:4,prose:''});
  sel=doc.steps.length-1; markDirty(); renderAll();
};
$('#addpart').onclick=()=>{
  doc.parts=doc.parts||[];
  doc.parts.push({id:uid('P'),label:'new part',size:[60,40,1.8],count:1,color:'#f2ede3'});
  markDirty(); renderAll();
};
$('#addhw').onclick=()=>{
  doc.hardware=doc.hardware||[];
  doc.hardware.push({id:uid('hw'),label:'new fastener',count:0});
  markDirty(); renderAll();
};
$('#gran').onchange=e=>{ gran=e.target.value; renderAll(); };
$('#autobox').onclick=()=>{
  const n=autoAssign();
  if(!n){ toast('nothing to assign - run pipeline/suggest_boxes.py'); return; }
  markDirty(); renderAll(); toast(`assigned ${n} hotspot${n>1?'s':''}`);
};
$('#sync').onclick=()=>{
  const bp=doc.manual?.buildPages||[];
  if(!bp.length){ toast('mark some build pages first'); return; }
  const byPg=new Map((doc.steps||[]).map(s=>[s.page,s]));
  doc.steps=bp.map((pg,i)=>{
    const s=byPg.get(pg)||{};
    return {title:s.title||`Page ${pg}`,page:pg,box:s.box||null,kind:s.kind||null,
            duration:s.duration??4,cam:s.cam||null,placeParts:s.placeParts||[],
            placeHardware:s.placeHardware||{},prose:s.prose||'',warn:s.warn||''};
  });
  sel=Math.min(sel<0?0:sel,doc.steps.length-1); markDirty(); renderAll();
  toast(`synced ${doc.steps.length} steps to ${bp.length} build pages`);
};
$('#notes').oninput=e=>{doc.notes=e.target.value;markDirty();};

$('#save').onclick=async()=>{
  const r=await api('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({path:`products/${pid}/build.json`,data:doc})});
  if(r.ok){ dirty=false; renderAll(); toast('saved'); }
  else toast('save failed: '+(r.error||'?'));
};

/* ------------------------------------------------------------ camera rig */
let camState=null;
function openCam(){
  if(sel<0||!doc.steps[sel]){ toast('select a step first'); return; }
  $('#camstep').textContent = (sel+1)+'. '+(doc.steps[sel].title||'');
  $('#cam').classList.add('on');
  if(!camState) camState=initCam();
  camState.rebuild();
  const c=doc.steps[sel].cam;
  if(c) camState.set(c);
  camState.loop();
}
$('#camclose').onclick=()=>{ $('#cam').classList.remove('on'); if(camState) camState.stop(); };
$('#camuse').onclick=()=>{
  if(!camState) return;
  doc.steps[sel].cam = camState.get();
  doc.steps[sel].camSource = 'human';
  markDirty(); $('#cam').classList.remove('on'); camState.stop(); renderAll();
  toast('camera stored');
};

function initCam(){
  const cv=$('#cv'), wrap=$('#cvwrap');
  const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
  const scene=new THREE.Scene(); scene.background=new THREE.Color('#0a0d12');
  const camera=new THREE.PerspectiveCamera(32,1,0.1,2000);
  const root=new THREE.Group(); scene.add(root);
  scene.add(new THREE.HemisphereLight('#dff0ff','#2a2620',1.5));
  const dl=new THREE.DirectionalLight('#fff6e8',2.2); dl.position.set(4,8,6); scene.add(dl);
  const grid=new THREE.GridHelper(40,40,0x2a3340,0x1a212a); scene.add(grid);

  // orbit state
  const st={yaw:-0.5,pitch:0.45,dist:14,target:new THREE.Vector3()};
  let raf=null,drag=null;

  function apply(){
    const cp=Math.cos(st.pitch);
    camera.position.set(
      st.target.x+st.dist*cp*Math.sin(st.yaw),
      st.target.y+st.dist*Math.sin(st.pitch),
      st.target.z+st.dist*cp*Math.cos(st.yaw));
    camera.lookAt(st.target);
  }
  function resize(){
    const w=wrap.clientWidth,h=wrap.clientHeight;
    if(!w||!h) return;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  }
  function rebuild(){
    root.clear();
    const d=doc.product?.dims||{};
    if(d.w&&d.h&&d.d){
      const g=new THREE.BoxGeometry(d.w*S,d.h*S,d.d*S);
      const box=new THREE.LineSegments(new THREE.EdgesGeometry(g),
        new THREE.LineBasicMaterial({color:0xffb454}));
      box.position.y=d.h*S/2; root.add(box);
      if(!doc.steps[sel]?.cam) st.target.set(0,d.h*S/2,0);
    }
    // lay the parts out flat in a row beside the silhouette
    let x=0;
    (doc.parts||[]).forEach(p=>{
      const [w,h,t]=p.size||[0,0,0]; if(!w||!h) return;
      const m=new THREE.Mesh(new THREE.BoxGeometry(w*S,Math.max(t,0.4)*S,h*S),
        new THREE.MeshStandardMaterial({color:p.color||'#f2ede3',roughness:.7}));
      m.position.set(x+w*S/2, Math.max(t,0.4)*S/2, (d.d?d.d*S/2:0)+2+ (h*S)/2);
      root.add(m); x+=w*S+0.3;
    });
    if(!doc.steps[sel]?.cam && d.h) st.dist = Math.max(8, d.h*S*1.7);
  }
  function loop(){
    cancelAnimationFrame(raf);
    const tick=()=>{ resize(); apply(); renderer.render(scene,camera); raf=requestAnimationFrame(tick); };
    tick();
  }
  function stop(){ cancelAnimationFrame(raf); raf=null; }
  function set(c){
    st.yaw=c.yaw; st.pitch=c.pitch; st.dist=c.dist;
    st.target.set(c.target[0],c.target[1],c.target[2]);
  }
  function get(){ return {target:[+st.target.x.toFixed(3),+st.target.y.toFixed(3),+st.target.z.toFixed(3)],
    yaw:+st.yaw.toFixed(3),pitch:+st.pitch.toFixed(3),dist:+st.dist.toFixed(3)}; }

  // pointer: drag orbit, shift/right drag pan, wheel zoom
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointerdown',e=>{
    drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove',e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.x=e.clientX; drag.y=e.clientY;
    if(drag.pan){
      const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
      const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
      const k=st.dist*0.0016;
      st.target.addScaledVector(right,-dx*k).addScaledVector(up,dy*k);
    } else { st.yaw-=dx*0.006; st.pitch=Math.max(-1.45,Math.min(1.45,st.pitch+dy*0.006)); }
  });
  addEventListener('pointerup',()=>drag=null);
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    st.dist=Math.max(1.2,Math.min(160,st.dist*(1+Math.sign(e.deltaY)*0.12)));
  },{passive:false});

  return {rebuild,loop,stop,set,get};
}

/* keys */
addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if(e.key==='ArrowDown'){ select(Math.min((doc?.steps?.length||1)-1,sel+1)); e.preventDefault(); }
  if(e.key==='ArrowUp'){ select(Math.max(0,sel-1)); e.preventDefault(); }
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){ e.preventDefault(); $('#save').click(); }
});

boot();
</script>
</body>
</html>
